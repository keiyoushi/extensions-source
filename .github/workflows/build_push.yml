name: Build LeerCapitulo APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew :src:es:leercapitulo:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeerCapitulo-debug
          path: src/es/leercapitulo/build/outputs/apk/debug/*.apk
