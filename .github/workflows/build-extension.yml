name: Build Extension

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Extension directory"
        required: true
        default: "src/es/mangako"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build extension
        env:
          MODULE: ${{ inputs.module }}
        run: |
          GRADLE_MODULE=":${MODULE//\//:}"
          ./gradlew "${GRADLE_MODULE}:assembleRelease"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: extension-apk
          path: |
            ${{ inputs.module }}/build/outputs/apk/release/*.apk
          if-no-files-found: error
