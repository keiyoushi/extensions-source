name: Build Silo APK

on:
  push:
    branches: [silo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Load only the Silo module
        run: sed -i 's|^loadAllIndividualExtensions()|// loadAllIndividualExtensions()|; s|^// loadIndividualExtension("all", "mangadex")|loadIndividualExtension("all", "silo")|' settings.gradle.kts

      - run: ./gradlew :src:all:silo:assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silo-apk
          path: src/all/silo/build/outputs/apk/debug/*.apk
